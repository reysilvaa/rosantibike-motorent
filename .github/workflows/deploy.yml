name: Deploy to VPS

on:
  push:
    branches:
      - main  # Ganti dengan nama branch utama yang kamu gunakan (misal: master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy ke VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /path/to/project
            git pull origin main  # Pastikan project di VPS sudah berada di branch yang sama
            # Contoh untuk Laravel:
            composer install --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            # Restart service jika perlu (misal: PHP-FPM, Nginx)
            sudo systemctl restart php8.1-fpm
            sudo systemctl restart nginx
          EOF
