name: Deploy Laravel ke VPS

on:
  push:
    branches:
      - main  # Ganti sesuai branch utama Anda

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # Stop jika terjadi error

            git config --global --add safe.directory /var/www/rosantibike

            echo "Memulai proses deploy ke VPS..."
            
            MAX_RETRIES=3
            RETRY=0

            while [ $RETRY -lt $MAX_RETRIES ]; do
              echo "Percobaan ke-$((RETRY+1))"

              if cd /var/www/rosantibike && \
                 git pull origin main && \
                 composer install --no-interaction --prefer-dist --optimize-autoloader && \
                 npm ci && npm run build && \
                 php artisan migrate --force && \
                 php artisan config:clear && \
                 php artisan config:cache && \
                 php artisan route:cache && \
                 php artisan view:cache && \
                 chmod -R 775 storage bootstrap/cache && \
                 chown -R www-data:www-data storage bootstrap/cache; then
                echo "Deploy berhasil!"
                break
              fi

              RETRY=$((RETRY+1))
              echo "Deploy gagal, mencoba lagi dalam 10 detik..."
              sleep 10
            done

            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "Deploy tetap gagal setelah $MAX_RETRIES percobaan."
              exit 1
            fi

            # Pastikan Supervisor berjalan (jika menggunakan queue worker)
            if sudo systemctl list-units --full --all | grep -Fq "supervisor.service"; then
              sudo systemctl restart supervisor
            fi

            # Restart Nginx dan PHP-FPM
            sudo systemctl restart nginx php8.2-fpm

            echo "✅ Deploy selesai tanpa error!"

      - name: Notifikasi jika Gagal
        if: failure()
        run: echo "🚨 Deploy Laravel ke VPS gagal! Periksa log di GitHub Actions."
