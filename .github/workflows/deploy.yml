name: Deploy Laravel ke VPS

on:
  push:
    branches:
      - main  # Ganti dengan branch utama proyekmu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # Hentikan skrip jika ada error

            echo "🚀 Memulai deploy ke VPS..."

            # Masuk ke direktori proyek
            cd /var/www/rosantibike

            echo "🔄 Reset perubahan lokal yang belum di-commit..."
            git reset --hard
            git clean -fd

            # Tambahkan safe directory agar tidak error
            git config --global --add safe.directory /var/www/rosantibike
            echo "✅ Git repository diizinkan!"

            # Tarik kode terbaru dari GitHub
            echo "🔄 Fetching latest code..."
            git pull origin main

            # Pastikan Composer terinstall
            if ! command -v composer &> /dev/null; then
              echo "⚠️ Composer tidak ditemukan, menginstall..."
              curl -sS https://getcomposer.org/installer | php
              sudo mv composer.phar /usr/local/bin/composer
            fi

            echo "📦 Menginstall dependensi PHP..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # Pastikan Node.js dan npm sesuai dengan versi VPS
            echo "🔍 Memeriksa versi Node.js dan npm..."
            node -v
            npm -v

            echo "📦 Menginstall npm dependencies..."
            npm ci --legacy-peer-deps  # Menghindari konflik dependency

            echo "⚡ Membuild frontend..."
            npm run build

            echo "🛠️ Optimasi konfigurasi Laravel..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "⚡ Menjalankan migrasi database..."
            php artisan migrate --force

            echo "🛠️ Mengatur izin folder..."
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache

            echo "🔄 Memeriksa Supervisor..."
            if ! systemctl is-active --quiet supervisor; then
              sudo systemctl start supervisor
            fi
            sudo systemctl restart supervisor

            echo "🔄 Restarting Nginx dan PHP-FPM..."
            sudo systemctl restart nginx php8.2-fpm

            echo "✅ Deploy selesai tanpa error!"

      - name: Notifikasi jika Gagal
        if: failure()
        run: echo "🚨 Deploy Laravel ke VPS gagal! Periksa log di GitHub Actions."
